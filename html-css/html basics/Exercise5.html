<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Software Development Inquiries</title>
</head>
<body>

    <h1>Contact Us</h1>

    <form action="#" method="post">

        <!-- Fieldset 1: Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </p>
            <p>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="(555) 123-4567">
            </p>
        </fieldset>

        <br>

        <!-- Fieldset 2: Message Details -->
        <fieldset>
            <legend>Message Details</legend>
            <p>
                <label for="subject">Subject:</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Select subject</option>
                    <option value="backend">Backend Architecture (Python/Node.js)</option>
                    <option value="database">Database Management (MongoDB)</option>
                    <option value="algorithms">Algorithmic Engineering (LeetCode/Logic)</option>
                    <option value="other">General Tech Inquiry</option>
                </select>
            </p>
            <p>
                <label>Priority:</label>
                <input type="radio" id="priority-low" name="priority" value="low">
                <label for="priority-low">Low</label>
                
                <input type="radio" id="priority-medium" name="priority" value="medium" checked>
                <label for="priority-medium">Medium</label>
                
                <input type="radio" id="priority-high" name="priority" value="high">
                <label for="priority-high">High</label>
            </p>
            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="50" placeholder="Your message..." required></textarea>
            </p>
        </fieldset>

        <br>

        <!-- Fieldset 3: Preferences -->
        <fieldset>
            <legend>Preferences</legend>
            <p>
                <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                <label for="newsletter">Subscribe to developer updates</label>
            </p>
            <p>
                <label for="contact-method">Preferred Contact Method:</label>
                <select id="contact-method" name="contact-method">
                    <option value="email">Email</option>
                    <option value="phone">Phone Call</option>
                </select>
            </p>
        </fieldset>

        <br>

        <!-- Action Buttons -->
        <input type="submit" value="Send Message">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
